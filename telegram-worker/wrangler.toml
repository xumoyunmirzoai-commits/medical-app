name = "medcore-bot"
main = "worker.js"
compatibility_date = "2024-11-01"

# Ochiq sozlamalar (maxfiy emas)
[vars]
DATA_BASE = "https://xumoyunmirzoai-commits.github.io/medical-app/bot-data/"
CHANNEL = "@MedCore_Tibbiyot_Platformasi"

# Foydalanuvchilarni saqlash (e'lon yuborish uchun)
[[kv_namespaces]]
binding = "USERS"
id = "9f265059da884a52a809628f234167cb"

# Maxfiy qiymatlar kod/toml ichida EMAS — alohida o'rnatiladi:
#   npx wrangler secret put BOT_TOKEN
#   npx wrangler secret put WEBHOOK_SECRET
#   npx wrangler secret put ADMIN_SECRET   (e'lon endpointi uchun)
